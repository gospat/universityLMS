<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 40" width="144" height="40" role="img" aria-labelledby="rsstitle rssdesc">
  <title id="rsstitle">Bell's University RSS Site Logo</title>
  <desc id="rssdesc">Horizontal site brand logo for RSS feeds: small Bell's University seal followed by the institutional wordmark.</desc>
  <defs>
    <linearGradient id="rssNavy" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#1a3a65"/>
    </linearGradient>
    <linearGradient id="rssGold" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0" stop-color="#f7d774"/>
      <stop offset="0.5" stop-color="#e0a422"/>
      <stop offset="1" stop-color="#b07d12"/>
    </linearGradient>
    <linearGradient id="rssGreen" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0" stop-color="#3d8b43"/>
      <stop offset="1" stop-color="#2a6130"/>
    </linearGradient>
    <radialGradient id="rssCream" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#fff8e4"/>
      <stop offset="1" stop-color="#f2e4bc"/>
    </radialGradient>
  </defs>
  <!-- Seal left side -->
  <g transform="translate(20 20) scale(0.555)">
    <circle r="36" fill="url(#rssNavy)"/>
    <circle r="36" fill="none" stroke="url(#rssGold)" stroke-width="0.8"/>
    <circle r="26" fill="url(#rssCream)"/>
    <circle r="26" fill="none" stroke="url(#rssGold)" stroke-width="0.8"/>
    <path id="rssArc" d="M -32 -4 A 30 30 0 0 1 32 -4" fill="none"/>
    <text font-family="'Georgia', serif" font-size="5.2" font-weight="700" fill="#fff8e4">
      <textPath href="#rssArc" startOffset="50%" text-anchor="middle">BELLS UNIVERSITY</textPath>
    </text>
    <path d="M -20 16 Q 0 28 20 16 L 18 24 Q 0 32 -18 24 Z" fill="url(#rssGreen)"/>
    <path d="M -16 19 Q 0 26 16 19" fill="none" id="rssRib"/>
    <text font-family="'Georgia', serif" font-size="4.2" font-style="italic" font-weight="700" fill="#fff8e4">
      <textPath href="#rssRib" startOffset="50%" text-anchor="middle">CHORDS</textPath>
    </text>
    <circle cx="-8" cy="-2" r="3.2" fill="none" stroke="url(#rssGold)" stroke-width="1.2"/>
    <rect x="-4" y="-3" width="16" height="2.4" fill="url(#rssGold)"/>
    <path d="M -6 -14 C -11 -14 -14 -8 -14 -2 L -11 2 A 6 6 0 0 0 11 2 L 14 -2 C 14 -8 11 -14 6 -14 Z" transform="translate(4 -4)" fill="url(#rssGold)"/>
  </g>
  <!-- Wordmark right side -->
  <text x="48" y="18" font-family="'Georgia', serif" font-size="12" font-weight="700" fill="#0a2540">BELLS UNIVERSITY</text>
  <text x="48" y="31" font-family="'Georgia', serif" font-size="8" font-style="italic" fill="#2a6130">Chords of Knowledge</text>
</svg>
