# Moodle core's upstream "Core" CI, imported with the Moodle tree.
#
# RETIRED FROM AUTOMATIC USE. It used to run on every push to every non-main branch, in
# parallel with the verified ULMS CI pipeline (ulms-ci.yml), and it failed on every run.
# It is now manual-only and is kept for the single check ulms-ci.yml does not perform.
#
# What was removed and why:
#   * The `push` trigger. It duplicated ulms-ci.yml on every branch, doubling CI minutes
#     and adding a second, unrelated red X to every push.
#   * The PHPUnit job. Its PHP 8.3 + PostgreSQL leg is covered by ulms-ci.yml (PHP 8.3 +
#     MySQL 8, one required and one advisory job), and its PHP 8.1 + MySQL leg tested a
#     Moodle version the university does not deploy. It also passed
#     `secrets.phpunit_options` into the PHPUnit command line, which nothing sets.
#
# What remains:
#   * The Grunt job, which verifies that the committed `build/` AMD assets match `src/`.
#     No other workflow checks this, and it matters here because production does not run
#     npm. It is manual-only so that its current failure cannot red-flag every push; it
#     fails because the committed assets are out of date, which is recorded as outstanding
#     technical debt in the ulms-ci.yml header. Run it from the Actions tab when you next
#     rebuild the assets.

name: Moodle asset check (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Grunt:
    name: Grunt (committed assets match src/)
    runs-on: ubuntu-24.04

    steps:
      - name: Checking out code
        uses: actions/checkout@v4

      - name: Configuring node & npm
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Installing node stuff
        run: npm install

      - name: Running grunt
        run: npx grunt

      - name: Looking for uncommitted changes
        # Add all files to the git index and then run diff --cached to see all changes.
        # This ensures that we get the status of all files, including new files.
        # We ignore npm-shrinkwrap.json to make the tasks immune to npm changes.
        run: |
          git add .
          git reset -- npm-shrinkwrap.json
          git diff --cached --exit-code
