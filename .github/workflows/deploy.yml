# Bells University of Technology — production gate.
#
# This workflow NEVER runs automatically. A push to `main` is validated by the ULMS CI
# pipeline (ulms-ci.yml) and nothing else; production is only ever reached by a human
# starting this workflow from the Actions tab.
#
# Two independent gates protect production:
#   1. Explicit initiation — the only trigger is workflow_dispatch, and the production job
#      is additionally skipped unless the operator sets `skip_deploy` to false. The safe
#      path is therefore the default.
#   2. The `production` GitHub Environment, whose protection rules require a reviewer to
#      approve the run before any step of the production job executes.
#
# This workflow performs no deployment: there is no SSH, no rsync and no call against the
# production server. It runs the quality gate, verifies the CODEOWNERS review gate and
# prints the operator checklist for a manual deployment.
#
# The previous version ran on every push to `main`, which meant a merge could reach the
# `production` environment without anyone asking for a deployment. That trigger has been
# removed.

name: ULMS Production Deploy

on:
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: Run the quality gate only and skip the production job
        type: boolean
        required: false
        default: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  php: "8.3"

permissions:
  contents: read
  issues: read
  pull-requests: read
  deployments: write

jobs:
  build:
    name: Build & Quality Gate
    runs-on: ubuntu-24.04
    outputs:
      ref_ok: ${{ steps.ref_ok.outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ env.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.php }}
          extensions: mysqli, curl, gd, mbstring, xml, zip, intl, soap, opcache, redis
          coverage: none
          tools: composer:v2

      - name: Install Composer deps
        run: |
          if [ -f composer.json ]; then
            composer validate --strict --no-check-publish 2>&1 || true
            composer check-platform-reqs --no-interaction 2>&1 || true
            composer install --prefer-dist --no-progress --no-interaction --no-dev 2>&1 || true
          fi

      - name: PHP syntax lint (plugins)
        run: |
          set -e
          FAILED=0
          for f in $(find local -name '*.php' -type f 2>/dev/null | sort); do
            php -l "$f" >/dev/null 2>&1 || { echo "LINT FAIL: $f"; FAILED=1; }
          done
          exit $FAILED

      - name: Composer scripts check
        run: |
          if [ -f composer.json ]; then
            composer run-script --list 2>&1 || true
          fi

      - name: Production Readiness Check (PRC smoke)
        run: |
          if [ -f local/ulms_dashboard/cli/production_readiness_check.php ]; then
            echo "PRC script found (full run requires live DB connection)"
            ls -la local/ulms_dashboard/cli/production_readiness_check.php
          fi

      - id: ref_ok
        name: Mark build passed
        run: echo "passed=1" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy to Production (Bells)
    needs: build
    # Explicit-opt-in gate: `skip_deploy` defaults to true, so an operator must
    # deliberately turn the production job on. The `production` environment below is the
    # second gate and still requires a reviewer to approve the run.
    if: github.event.inputs.skip_deploy != 'true'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://learn.bellsuniversity.edu.ng
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CODEOWNERS review gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Production deployments require CODEOWNERS review."
          echo "Manual deploy via SSH: scripts/ulms_refresh_live.sh --dry-run"
          echo "Environment: Bells University LMS host=bells-moodle-lms webroot=/var/www/universityLMS"

      - name: Show deploy summary
        run: |
          echo "=== ULMS Production deploy checklist ==="
          echo "  [1] git pull origin main on bells-moodle-lms"
          echo "  [2] php admin/cli/upgrade.php --non-interactive"
          echo "  [3] php local/ulms_dashboard/cli/production_readiness_check.php"
          echo "  [4] Review PRC output: 70/70 expected"
          echo "  [5] scripts/ulms_refresh_live.sh (atomic swap if applicable)"
