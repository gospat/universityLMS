; PHP local development server overrides for ULMS student login.
; Production should use real php.ini values.
session.save_path = "/tmp"
session.gc_maxlifetime = 7200
session.use_only_cookies = On
date.timezone = "Europe/London"
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 96M
max_execution_time = 120
opcache.enable = 0
