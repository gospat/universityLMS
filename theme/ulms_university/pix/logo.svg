<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-labelledby="bells-logo-title bells-logo-desc">
  <title id="bells-logo-title">Bell's University of Technology wordmark and seal</title>
  <desc id="bells-logo-desc">Horizontal 600x200 banner: left side circular Bells seal with three gold bells on a key, right side institutional wordmark BELLS UNIVERSITY OF TECHNOLOGY with CHORDS OF KNOWLEDGE tagline.</desc>
  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b5fa8"/>
      <stop offset="100%" stop-color="#0f3d67"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d06f"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#9c7a1a"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#19a852"/>
      <stop offset="100%" stop-color="#0a6330"/>
    </linearGradient>
    <radialGradient id="creamGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fffbe8"/>
      <stop offset="100%" stop-color="#f4e3b8"/>
    </radialGradient>
  </defs>

  <!-- ============ LEFT SIDE: CIRCULAR SEAL (cx=100, cy=100, r=90) ============ -->
  <!-- Outer gold thin ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <!-- Outer navy ring (thick) -->
  <circle cx="100" cy="100" r="88" fill="url(#navyGrad)"/>
  <!-- Inner cream disc -->
  <circle cx="100" cy="100" r="70" fill="url(#creamGrad)"/>
  <!-- Navy inner thin border -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#0f3d67" stroke-width="1.5"/>

  <!-- Arc text: top arc BELLS UNIVERSITY OF TECHNOLOGY on navy ring -->
  <defs>
    <path id="topArc" d="M 28,100 A 78,78 0 0,1 172,100"/>
    <path id="bottomArcRibbon" d="M 40,122 A 68,68 0 0,0 160,122"/>
  </defs>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="10.4" font-weight="800" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      BELLS UNIVERSITY OF TECHNOLOGY
    </textPath>
  </text>

  <!-- Green ribbon at bottom arc -->
  <path d="M 44 126 Q 100 162 156 126 L 150 144 Q 100 174 50 144 Z" fill="url(#greenGrad)" stroke="#07421f" stroke-width="0.8"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="7.6" font-weight="700" fill="#ffffff" letter-spacing="0.6">
    <textPath href="#bottomArcRibbon" startOffset="50%" text-anchor="middle">
      CHORDS OF KNOWLEDGE
    </textPath>
  </text>

  <!-- ===== CENTRAL CREAM INTERIOR: 3 bells on a key + open book + small globe ===== -->
  <!-- KEY (diagonal, from upper-left to lower-right within cream disc) -->
  <g transform="translate(100 100)">
    <!-- Key shaft -->
    <rect x="-3" y="-28" width="6" height="46" rx="3" fill="url(#goldGrad)" stroke="#8a670f" stroke-width="0.5"/>
    <!-- Key bow (ring top) -->
    <circle cx="0" cy="-34" r="10" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="0" cy="-34" r="5" fill="url(#creamGrad)" stroke="#8a670f" stroke-width="0.5"/>
    <!-- Key teeth at bottom -->
    <rect x="3" y="10" width="9" height="3" fill="url(#goldGrad)" stroke="#8a670f" stroke-width="0.3"/>
    <rect x="3" y="16" width="7" height="3" fill="url(#goldGrad)" stroke="#8a670f" stroke-width="0.3"/>
  </g>

  <!-- BELL 1 (small, left) -->
  <g transform="translate(68 82)">
    <path d="M -10 0 C -10 -10 -6 -16 0 -16 C 6 -16 10 -10 10 0 L 7 2 L 5 1 Q 5 5 0 5 Q -5 5 -5 1 L -7 2 Z"
          fill="url(#goldGrad)" stroke="#8a670f" stroke-width="0.6"/>
    <circle cx="0" cy="6" r="1.4" fill="#8a670f"/>
    <line x1="0" y1="-16" x2="0" y2="-20" stroke="#8a670f" stroke-width="0.8"/>
  </g>

  <!-- BELL 2 (medium, center-top, largest) -->
  <g transform="translate(100 72)">
    <path d="M -13 0 C -13 -14 -7 -22 0 -22 C 7 -22 13 -14 13 0 L 9 2.5 L 6.5 1.5 Q 6.5 6.5 0 6.5 Q -6.5 6.5 -6.5 1.5 L -9 2.5 Z"
          fill="url(#goldGrad)" stroke="#8a670f" stroke-width="0.7"/>
    <circle cx="0" cy="8.5" r="1.8" fill="#8a670f"/>
    <line x1="0" y1="-22" x2="0" y2="-27" stroke="#8a670f" stroke-width="1"/>
  </g>

  <!-- BELL 3 (small, right) -->
  <g transform="translate(132 82)">
    <path d="M -10 0 C -10 -10 -6 -16 0 -16 C 6 -16 10 -10 10 0 L 7 2 L 5 1 Q 5 5 0 5 Q -5 5 -5 1 L -7 2 Z"
          fill="url(#goldGrad)" stroke="#8a670f" stroke-width="0.6"/>
    <circle cx="0" cy="6" r="1.4" fill="#8a670f"/>
    <line x1="0" y1="-16" x2="0" y2="-20" stroke="#8a670f" stroke-width="0.8"/>
  </g>

  <!-- OPEN BOOK (underneath bells/key) -->
  <g transform="translate(100 120)">
    <path d="M -30 -2 L -4 -10 Q 0 -12 4 -10 L 30 -2 L 30 6 L -30 6 Z"
          fill="#fffbe8" stroke="#0f3d67" stroke-width="0.8"/>
    <line x1="0" y1="-11" x2="0" y2="6" stroke="#0f3d67" stroke-width="0.8"/>
    <!-- Book pages lines -->
    <line x1="-26" y1="0" x2="-6" y2="-7" stroke="#c9a227" stroke-width="0.5"/>
    <line x1="-24" y1="3" x2="-5" y2="-2" stroke="#c9a227" stroke-width="0.5"/>
    <line x1="26" y1="0" x2="6" y2="-7" stroke="#c9a227" stroke-width="0.5"/>
    <line x1="24" y1="3" x2="5" y2="-2" stroke="#c9a227" stroke-width="0.5"/>
  </g>

  <!-- Tiny GLOBE (top right accent in cream disc) -->
  <g transform="translate(128 50)">
    <circle cx="0" cy="0" r="8" fill="#8ac6ff" stroke="#0f3d67" stroke-width="0.7"/>
    <path d="M -8 0 Q -4 -2 0 0 Q 4 2 8 0" fill="none" stroke="#0f3d67" stroke-width="0.5"/>
    <path d="M -8 0 Q -4 2 0 0 Q 4 -2 8 0" fill="none" stroke="#0f3d67" stroke-width="0.5"/>
    <ellipse cx="0" cy="0" rx="8" ry="3.2" fill="none" stroke="#0f3d67" stroke-width="0.5"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#0f3d67" stroke-width="0.5"/>
    <!-- Continent hint -->
    <path d="M -3 -4 Q -2 -6 1 -5 Q 3 -3 2 0 Q 0 3 -2 2 Q -4 0 -3 -4 Z" fill="#19a852" opacity="0.7"/>
  </g>

  <!-- ============ RIGHT SIDE: WORDMARK ============ -->
  <!-- Main text -->
  <g transform="translate(220 82)">
    <text x="0" y="0" font-family="'Century Gothic', Georgia, 'Trebuchet MS', sans-serif"
          font-size="24" font-weight="800" fill="#0f3d67" letter-spacing="0.6">
      BELLS
    </text>
    <text x="95" y="0" font-family="'Century Gothic', Georgia, 'Trebuchet MS', sans-serif"
          font-size="24" font-weight="400" fill="#0f4c81" letter-spacing="0.5">
      UNIVERSITY
    </text>
    <text x="0" y="28" font-family="'Century Gothic', Georgia, 'Trebuchet MS', sans-serif"
          font-size="22" font-weight="300" fill="#0f4c81" letter-spacing="2.4">
      OF TECHNOLOGY
    </text>
    <!-- Accent divider -->
    <rect x="0" y="40" width="80" height="3" fill="url(#greenGrad)"/>
    <!-- Tagline -->
    <text x="0" y="64" font-family="Georgia, serif" font-size="14"
          font-style="italic" font-weight="500" fill="#0a6330" letter-spacing="0.4">
      Chords of Knowledge
    </text>
    <!-- Subtitle -->
    <text x="0" y="86" font-family="system-ui, 'Segoe UI', sans-serif" font-size="10.5"
          fill="#5c6f82" letter-spacing="0.3">
      Ota, Ogun State, Nigeria — Est. 2005
    </text>
  </g>
</svg>
