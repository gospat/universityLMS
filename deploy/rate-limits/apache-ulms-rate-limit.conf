# Apache .htaccess rate-limit fallback — ULMS T17
#
# Copy-paste this into the ULMS webroot `.htaccess` (or the
# management/ + lecturer/ sub-.htaccess files) if you deploy on
# Apache instead of Nginx.
#
# Requires: mod_ratelimit, mod_rewrite, mod_env loaded.
#
# Strategy: use request-counter env vars (per-IP as a proxy for
# per-user; combine with mod_qos if you need per-session precision).
# The Apache approach is best-effort and pairs nicely with the
# Cloudflare ruleset template for defense-in-depth at the edge.

<IfModule mod_rewrite.c>
    RewriteEngine On
</IfModule>

# --- Attendance writes: 30/minute per client IP ---
<IfModule mod_qos.c>
    QS_LocRequestLimitMatch ^/(lecturer/attendance/|management/attendance/|local/ulms_dashboard/portal/.*attendance) 30
    QS_LocRequestPerSecLimitMatch ^/(lecturer/attendance/|management/attendance/) 1
</IfModule>

<IfModule !mod_qos.c>
    # Soft mod-ratelimit fallback if mod_qos is unavailable (30 req/min ~= 2s between)
    <LocationMatch "^/(lecturer/attendance/|management/attendance/|local/ulms_dashboard/portal/.*attendance)">
        <IfModule mod_ratelimit.c>
            SetOutputFilter RATE_LIMIT
            SetEnv rate-limit 80
            SetEnv rate-initial-burst 512
        </IfModule>
    </LocationMatch>
</IfModule>

# --- Schedule writes: 30/minute per client IP ---
<IfModule mod_qos.c>
    QS_LocRequestLimitMatch ^/(management/academics/schedule/|local/ulms_dashboard/portal/.*schedule) 30
</IfModule>

# --- Deny hotlink to cron wrapper & install helper CLI binaries from web ---
<FilesMatch "^(run_moodle_cron\.sh|install_cron\.php|seed_demo_academic_chain\.php|production_readiness_check\.php)$">
    Require all denied
</FilesMatch>

# --- Never serve raw .sqlite / dump files if they slip into webroot ---
<FilesMatch "\.(sql|sqlite|sqlite3|bak|orig|rej|log)$">
    Require all denied
</FilesMatch>
