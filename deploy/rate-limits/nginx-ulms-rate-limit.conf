# Nginx rate-limit snippet — ULMS T17 Production
#
# Drop into /etc/nginx/snippets/ulms-rate-limit.conf and include from the
# ULMS server {} block.  Rate limits are per-Moodle-session (cookie keyed),
# which means a single user on shared IP can't starve others.
#
# Limits (aligned with deployment checklist):
#   * 30 req/min on Attendance writes (lecturer bulk-mark, CSV export)
#   * 30 req/min on Schedule writes (management schedule create/update/delete)
#   * 200 req/min on everything else (portal KPI reads)
#   * Burst allowance with nodelay so legitimate fast clicks pass, abuse throttles

# ==== Shared zone definitions (MUST live in http {} context) ====
# Copy these 3 lines into /etc/nginx/nginx.conf `http { ... }` once:
#
#   limit_req_zone $cookie_MoodleSession zone=ulms_attendance_write:10m rate=30r/m;
#   limit_req_zone $cookie_MoodleSession zone=ulms_schedule_write:10m   rate=30r/m;
#   limit_req_zone $cookie_MoodleSession zone=ulms_portal_read:10m      rate=200r/m;

# ==== Copy paste inside server {} (or /etc/nginx/snippets/ulms-rate-limit.conf) ====

# Attendance lecturer/management endpoints — attendance marking, bulk, CSV
location ~* ^/(lecturer/attendance/|management/attendance/|local/ulms_dashboard/portal/.*attendance) {
    limit_req zone=ulms_attendance_write burst=15 nodelay;
    limit_req_status 429;

    # Standard Moodle/Symfony PHP-FPM passthru — adjust socket to match your host:
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    add_header Retry-After 2 always;
}

# Schedule timetable write endpoints — create/edit/delete class sessions
location ~* ^/(management/academics/schedule/|local/ulms_dashboard/portal/.*schedule) {
    limit_req zone=ulms_schedule_write burst=15 nodelay;
    limit_req_status 429;

    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    add_header Retry-After 2 always;
}

# General read portal (KPI dashboards) — soft ceiling, burst higher
location ~* ^/(super-admin/|management/|lecturer/|student/|admin/|local/ulms_dashboard/portal/) {
    limit_req zone=ulms_portal_read burst=80 nodelay;
    limit_req_status 429;

    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.1-fpm.sock;
}

# Graceful fallback — 429 JSON response the ULMS KPI widget understands
error_page 429 /429-too-many-requests.json;
location = /429-too-many-requests.json {
    default_type application/json;
    return 429 '{"ok":false,"error":"ratelimit_hit","retry_after":2}';
}
