# ===========================================================================
# ULMS trusted-proxy real client IP — Cloudflare  (Bells University of Technology)
# ===========================================================================
#
# PURPOSE
#   Give Nginx and PHP one canonical, spoof-safe view of the real client IP when
#   the site is behind Cloudflare.  Once these directives are active, Nginx
#   rewrites $remote_addr (and therefore FastCGI REMOTE_ADDR, which Moodle reads
#   via getremoteaddr()) to the genuine client address taken from
#   CF-Connecting-IP — but ONLY when the connecting peer is genuinely one of
#   Cloudflare's edge ranges.  A direct-to-origin request can therefore no
#   longer spoof a Cloudflare header and fake its own address.
#
#   The application layer (local/ulms_auth .../ratelimit/client_ip.php) performs
#   its own trusted-peer check as defence in depth; this snippet is what feeds
#   it the validated address.
#
# CONTEXT
#   ngx_http_realip_module directives are valid in http{}, server{} and
#   location{}.  Two options:
#     (a) include this file inside each server{} block, or
#     (b) include it once inside http{} to apply site-wide.
#   The production site files (deploy/nginx/learn.bellsuniversity.edu.ng.conf and
#   deploy/nginx/TEMPLATE.site.conf) currently inline these same directives; this
#   file is the managed, single-source replacement you can include instead.
#
#   DO NOT apply this to a host that is not actually behind Cloudflare, and never
#   add an origin IP / private range here: that would let anything reaching Nginx
#   directly dictate its own client IP.
#
# DEPLOYMENT (manual, approved change window)
#   1. Back up the live config:   sudo cp /etc/nginx/sites-enabled/<site> \
#                                      /etc/nginx/sites-enabled/<site>.bak-$(date +%F)
#   2. Copy this file to:          /etc/nginx/snippets/ulms-cloudflare-realip.conf
#   3. In the site's server{} block, replace the inline set_real_ip_from /
#      real_ip_header / real_ip_recursive lines with:
#          include snippets/ulms-cloudflare-realip.conf;
#   4. Verify syntax:              sudo nginx -t
#   5. Reload:                     sudo systemctl reload nginx
#
# VERIFICATION (run after reload)
#   # a) Direct origin hit with a spoofed header must NOT change the logged IP:
#   curl -s -H 'CF-Connecting-IP: 1.2.3.4' -H 'X-Forwarded-For: 1.2.3.4' \
#        -o /dev/null -w '%{http_code}\n' https://<origin-ip>/sign-in/
#   # Access log for that request must show the real origin (server) IP or your
#   # test source, NOT 1.2.3.4.
#   sudo tail -n 5 /var/log/nginx/access.log
#
#   # b) Through Cloudflare, the client IP must be the true browser IP:
#   curl -s https://learn.bellsuniversity.edu.ng/healthz.php
#   sudo tail -n 5 /var/log/nginx/access.log   # first field == your public IP
#
#   # c) Confirm Cloudflare ranges are current before/after deploy (see below):
#   curl -s https://www.cloudflare.com/ips-v4 | sort > /tmp/cf-v4.txt
#   curl -s https://www.cloudflare.com/ips-v6 | sort > /tmp/cf-v6.txt
#   diff <(grep '^set_real_ip_from' /etc/nginx/snippets/ulms-cloudflare-realip.conf \
#          | grep -v ':' | awk '{print $2}') /tmp/cf-v4.txt   # must be empty
#
# CLOUDFLARE IP RANGE MANAGEMENT
#   Cloudflare publishes the authoritative lists (refresh these periodically and
#   whenever Cloudflare announces a change):
#       https://www.cloudflare.com/ips-v4
#       https://www.cloudflare.com/ips-v6
#   The block below is the verified set as deployed for the Bells production
#   origin.  Regenerate it with:
#       { curl -s https://www.cloudflare.com/ips-v4
#         curl -s https://www.cloudflare.com/ips-v6; } \
#         | sed 's/^/set_real_ip_from /; s/$/;/'
#
# ROLLBACK
#   Restore the previous config and reload:
#       sudo mv /etc/nginx/sites-enabled/<site>.bak-<date> /etc/nginx/sites-enabled/<site>
#       sudo nginx -t && sudo systemctl reload nginx
#   Or, to keep this snippet but stop trusting forwarded headers, comment out the
#   include line or set `real_ip_header` back to its default and reload.  Test
#   with verification step (a) above to confirm spoofing is inert.
# ===========================================================================

# ---- Cloudflare IPv4 (https://www.cloudflare.com/ips-v4) ----
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# ---- Cloudflare IPv6 (https://www.cloudflare.com/ips-v6) ----
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Trust the Cloudflare-set client header only from the peers listed above.
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
