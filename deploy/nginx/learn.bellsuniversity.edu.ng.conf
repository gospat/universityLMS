# Bells University ULMS — Nginx site reference (Ubuntu 24.04 LTS, PHP 8.3 FPM)
# Target: learn.bellsuniversity.edu.ng (Cloudflare proxied → 165.232.37.213)
#
# INSTALL ON DROPLET:
#   sudo cp deploy/nginx/learn.bellsuniversity.edu.ng.conf \
#        /etc/nginx/sites-available/learn.bellsuniversity.edu.ng.conf
#   sudo ln -sf /etc/nginx/sites-available/learn.bellsuniversity.edu.ng.conf \
#               /etc/nginx/sites-enabled/learn.bellsuniversity.edu.ng.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# DO NOT edit /etc/nginx/nginx.conf by hand for site-level changes — keep the
# site-specific configuration here so it stays reproducible across rebuilds.

# ---------------------------------------------------------------------------
# 1. HTTP -> HTTPS redirect (port 80)
#    Runs on the Droplet public listener.  Cloudflare "Always Use HTTPS" is
#    also recommended as an additional belt-and-braces redirect in front of
#    this.  Never terminate plain HTTP permanently.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name learn.bellsuniversity.edu.ng;

    # Real client IP when Cloudflare is in front.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    return 301 https://learn.bellsuniversity.edu.ng$request_uri;
}

# ---------------------------------------------------------------------------
# 2. HTTPS site (port 443)
#    Cloudflare does the TLS termination at the edge, but we still set safe
#    SSL/TLS parameters here in case someone later switches Cloudflare mode
#    to Full (Strict) with an origin-cert installed directly on the Droplet.
#    The redirect above + CF Full/Full(Strict) mode = NO plaintext ever.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name learn.bellsuniversity.edu.ng;

    root /var/www/universityLMS;
    index index.php index.html index.htm;

    # —— Origin TLS (present but harmless until origin cert installed) ——
    # Install a Cloudflare Origin CA cert (recommended) or Let's Encrypt
    # (acme.sh/certbot) at these paths BEFORE flipping CF SSL/TLS mode to
    # Full (Strict).  Until then nginx will bind but browsers hit CF only.
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # —— Real client IP (repeat for 443) ——
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # —— Upload & body limits ——
    client_max_body_size 2G;
    client_body_timeout 600s;
    fastcgi_read_timeout 600s;
    fastcgi_send_timeout 600s;
    proxy_read_timeout 600s;

    # —— Security headers (applied to ALL responses) ——
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=0; includeSubDomains" always;
    # ↑ HSTS deliberately starts at max-age=0 — bump to 15552000 (180 days)
    # after a full month of stable HTTPS operation, THEN consider preload.
    # Premature preload bricks the site if cert renewal ever goes wrong.

    # —— Deny access to sensitive files BEFORE routing / PHP handling ——
    # This list MUST stay in sync with the repository .gitignore secrets list.
    location ~* ^/(?:\.env|\.env\.[^/]+|\.git(?:/.*)?|\.htaccess|\.htpasswd|\.user\.ini|composer\.(?:json|lock|phar)|package(?:-lock)?\.json|phpunit.*\.xml(?:\.dist)?|yarn\.lock|pnpm-lock\.yaml|config\.php|README(?:\.[a-zA-Z0-9]+)?\.md|INSTALL(?:\.[a-zA-Z0-9]+)?\.txt|UPGRADING\.md|COPYING\.txt|TRADEMARK\.txt|CONTRIBUTING\.md|config\.php\.bak|config\.php\.old|install/config\.php|.*\.(?:bak|orig|swp|swo|tar\.gz|zip))$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # —— Deny direct access to the dataroot (in case of misconfiguration) ——
    location ^~ /var/lib/moodledata/ { deny all; }

    # —— Moodle slasharguments ——
    location / {
        try_files $uri $uri/ @moodle_slashargs;
    }
    location @moodle_slashargs {
        rewrite ^(.*)$ /index.php?s=/$1 last;
    }

    # —— PHP handling ——
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO        $fastcgi_path_info if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_NAME      $fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT    $document_root;
        # Tell Moodle (and the ULMS config.php upstream header detection)
        # that the client-facing transport is HTTPS even though the
        # Cloudflare→origin hop is plain-HTTP or origin-HTTPS on :8443.
        fastcgi_param HTTPS            on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_SSL   on;
        fastcgi_param REMOTE_ADDR      $remote_addr;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 64k;
        fastcgi_busy_buffers_size 128k;
    }

    # —— Serve static assets with lenient caching ——
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # —— Silence favicon not-found noise ——
    location = /favicon.ico {
        try_files /pix/favicon.ico =204;
        access_log off;
        log_not_found off;
    }
    location = /robots.txt {
        try_files $uri =204;
        access_log off;
    }

    # —— logging ——
    access_log /var/log/nginx/learn.bellsuniversity.edu.ng.access.log;
    error_log  /var/log/nginx/learn.bellsuniversity.edu.ng.error.log warn;
}
