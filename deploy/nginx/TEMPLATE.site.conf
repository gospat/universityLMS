# ============================================================
# GENERIC PORTABLE Nginx SITE TEMPLATE — ULMS (any university)
# ------------------------------------------------------------
# Copy this file for every NEW institution deployment, then
# run the sed one-liner below to replace all tokens with your
# institution-specific values in one command.
#
# QUICK START (run from the repository root on the target server):
#
#   export LMS_DOMAIN="lms.youruniversity.edu.ng"
#   export WEBROOT="/var/www/universityLMS"
#   export PHP_FPM_SOCKET="/run/php/php8.3-fpm.sock"
#   export LOG_PATH="/var/log/nginx"
#   export TRUSTED_PROXY_CIDRS="cloudflare"   # or: "internal-lb" or: "none"
#
#   sed -e "s|%%REPLACE_LMS_DOMAIN%%|${LMS_DOMAIN}|g" \
#       -e "s|%%REPLACE_WEBROOT%%|${WEBROOT}|g" \
#       -e "s|%%REPLACE_PHP_FPM_SOCKET%%|${PHP_FPM_SOCKET}|g" \
#       -e "s|%%REPLACE_LOG_PATH%%|${LOG_PATH}|g" \
#       deploy/nginx/TEMPLATE.site.conf \
#       > /tmp/${LMS_DOMAIN}.conf
#
#   # -- Now review /tmp/${LMS_DOMAIN}.conf and install it:
#   sudo install -o root -g root -m 0644 /tmp/${LMS_DOMAIN}.conf \
#        /etc/nginx/sites-available/${LMS_DOMAIN}.conf
#   sudo ln -sf /etc/nginx/sites-available/${LMS_DOMAIN}.conf \
#               /etc/nginx/sites-enabled/${LMS_DOMAIN}.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TOKENS:
#   %%REPLACE_LMS_DOMAIN%%       FQDN of the LMS (no protocol, no trailing /)
#   %%REPLACE_WEBROOT%%          Absolute path to the Moodle webroot
#   %%REPLACE_PHP_FPM_SOCKET%%   PHP-FPM pool socket (unix:/path/to.sock) or host:port
#   %%REPLACE_LOG_PATH%%         Absolute directory where nginx writes access/error logs
#   (Trusted proxy CIDRs are inline below — edit set_real_ip_from lines if you
#    are NOT fronting this with Cloudflare; see section inline comments.)
#
# DO NOT deploy the TEMPLATE file itself to sites-enabled.  Always
# generate a per-institution site file using the sed command above.
# ============================================================

# ---------------------------------------------------------------------------
# 1. HTTP -> HTTPS redirect (port 80)
#    Runs on the origin public listener.  Cloudflare "Always Use HTTPS" is
#    also recommended as an additional belt-and-braces redirect in front of
#    this.  Never terminate plain HTTP permanently.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name %%REPLACE_LMS_DOMAIN%%;

    # -- Trusted proxy real-IP restoration --
    # DEFAULT BELOW: Cloudflare CIDR list (all 22 public ranges, IPv4 + IPv6).
    # If your institution uses a DIFFERENT upstream proxy (institutional WAF,
    # AWS ALB, GCP LB, internal nginx) DELETE the entire block below and
    # replace with the real source CIDRs of YOUR proxy layer.  If you expose
    # Nginx DIRECTLY to the internet (no proxy in front) DELETE every
    # set_real_ip_from / real_ip_header / real_ip_recursive line entirely.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    return 301 https://%%REPLACE_LMS_DOMAIN%%$request_uri;
}

# ---------------------------------------------------------------------------
# 2. HTTPS site (port 443)
#    If your proxy terminates TLS (e.g. Cloudflare orange cloud) the origin
#    cert below is only used if you later switch to Full (strict) mode with
#    an origin-cert installed directly at Nginx.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name %%REPLACE_LMS_DOMAIN%%;

    root %%REPLACE_WEBROOT%%;
    index index.php index.html index.htm;

    # —— Origin TLS (bind succeeds even with snakeoil; replace with real cert) ——
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # —— Real client IP (repeat the SAME proxy CIDR list as the :80 block) ——
    # (See proxy note in the :80 block above.)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # —— Upload & body limits (Moodle 4.5 SCORM / backup / restore minima) ——
    client_max_body_size 2G;
    client_body_timeout 600s;
    fastcgi_read_timeout 600s;
    fastcgi_send_timeout 600s;
    proxy_read_timeout 600s;

    # —— Security headers (applied to ALL responses) ——
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=0; includeSubDomains" always;
    # ↑ HSTS deliberately starts at max-age=0 — bump to 15552000 (180 days)
    # after a full month of stable HTTPS operation, THEN consider preload.

    # —— Deny access to sensitive files BEFORE routing / PHP handling ——
    location ~* ^/(?:\.env|\.env\.[^/]+|\.git(?:/.*)?|\.htaccess|\.htpasswd|\.user\.ini|composer\.(?:json|lock|phar)|package(?:-lock)?\.json|phpunit.*\.xml(?:\.dist)?|yarn\.lock|pnpm-lock\.yaml|config\.php|README(?:\.[a-zA-Z0-9]+)?\.md|INSTALL(?:\.[a-zA-Z0-9]+)?\.txt|UPGRADING\.md|COPYING\.txt|TRADEMARK\.txt|CONTRIBUTING\.md|config\.php\.bak|config\.php\.old|install/config\.php|.*\.(?:bak|orig|swp|swo|tar\.gz|zip))$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # —— Deny direct access to any dataroot path (defense in depth) ——
    location ^~ /var/lib/ { deny all; }

    # —— Moodle slasharguments ——
    location / {
        try_files $uri $uri/ @moodle_slashargs;
    }
    location @moodle_slashargs {
        rewrite ^(.*)$ /index.php?s=/$1 last;
    }

    # —— PHP handling ——
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO        $fastcgi_path_info if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_NAME      $fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT    $document_root;
        # Tell Moodle / ULMS config.php that the public-facing transport is HTTPS
        # even when the proxy→origin hop is plain HTTP or origin TLS on a non-443 port.
        fastcgi_param HTTPS            on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_SSL   on;
        fastcgi_param REMOTE_ADDR      $remote_addr;
        fastcgi_pass unix:%%REPLACE_PHP_FPM_SOCKET%%;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 64k;
        fastcgi_busy_buffers_size 128k;
    }

    # —— Serve static assets with lenient caching ——
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # —— Silence noise ——
    location = /favicon.ico {
        try_files /pix/favicon.ico =204;
        access_log off;
        log_not_found off;
    }
    location = /robots.txt {
        try_files $uri =204;
        access_log off;
    }

    # —— logging ——
    access_log %%REPLACE_LOG_PATH%%/%%REPLACE_LMS_DOMAIN%%.access.log;
    error_log  %%REPLACE_LOG_PATH%%/%%REPLACE_LMS_DOMAIN%%.error.log warn;
}
