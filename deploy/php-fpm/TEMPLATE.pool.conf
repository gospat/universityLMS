; ============================================================
; GENERIC PORTABLE PHP-FPM POOL TEMPLATE — ULMS (any university)
; ------------------------------------------------------------
; Copy this file for every NEW institution deployment, then run
; the sed one-liner below to replace all tokens with your
; institution-specific values in one command.
;
; QUICK START (run from the repository root on the target server):
;
;   export POOL_NAME="www"                   # PHP-FPM pool [section] name
;   export SOCKET_PATH="/run/php/php8.3-fpm.sock"
;   export WEBROOT="/var/www/universityLMS"
;   export PHP_VERSION="8.3"                  # matches installed SAPI
;
;   sed -e "s|%%REPLACE_POOL_NAME%%|${POOL_NAME}|g" \
;       -e "s|%%REPLACE_SOCKET_PATH%%|${SOCKET_PATH}|g" \
;       -e "s|%%REPLACE_WEBROOT%%|${WEBROOT}|g" \
;       deploy/php-fpm/TEMPLATE.pool.conf \
;       > /tmp/ulms-${POOL_NAME}.conf
;
;   # -- Review /tmp/ulms-${POOL_NAME}.conf then install:
;   sudo install -o root -g root -m 0644 /tmp/ulms-${POOL_NAME}.conf \
;        /etc/php/${PHP_VERSION}/fpm/pool.d/ulms-${POOL_NAME}.conf
;   # If a default [www] pool already exists and conflicts, rename it:
;   sudo mv /etc/php/${PHP_VERSION}/fpm/pool.d/www.conf \
;           /etc/php/${PHP_VERSION}/fpm/pool.d/www.conf.orig
;   sudo php-fpm${PHP_VERSION} -t
;   sudo systemctl restart php${PHP_VERSION}-fpm
;
; TOKENS:
;   %%REPLACE_POOL_NAME%%     PHP-FPM [section] name (typically "www" for single-site)
;   %%REPLACE_SOCKET_PATH%%   Absolute Unix socket path (listen = line)
;   %%REPLACE_WEBROOT%%       Absolute webroot path used for chroot, docroot, session path
;
; DO NOT deploy TEMPLATE.pool.conf directly.  Always generate a
; per-institution pool file using the sed command above.
; ============================================================

[%%REPLACE_POOL_NAME%%]
user = www-data
group = www-data

listen = %%REPLACE_SOCKET_PATH%%
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.acl_users =
listen.allowed_clients =

; PM sizing (dynamic — tune for your RAM / CPU):
;   4 GB droplet  = pm.max_children 20, start_servers 4, min/max_spare 2/8
;   8 GB droplet  = pm.max_children 40, start_servers 8, min/max_spare 4/16   (default)
;   16 GB droplet = pm.max_children 80, start_servers 16, min/max_spare 8/32
pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.process_idle_timeout = 30s
pm.max_requests = 500
pm.status_path = /fpm-status

; -- Moodle 4.5 minimums + headroom for backup/restore/SCORM/LTI --
php_admin_value[memory_limit]        = 512M
php_admin_value[upload_max_filesize] = 2G
php_admin_value[post_max_size]       = 2G
php_admin_value[max_input_time]      = 600
php_admin_value[max_execution_time]  = 600
php_admin_value[realpath_cache_size] = 4096K
php_admin_value[realpath_cache_ttl]  = 600
php_admin_value[default_socket_timeout] = 60

; -- OPcache (PHP 8.x — tune interned_strings_buffer for heavy classloader use) --
php_admin_value[opcache.enable]            = 1
php_admin_value[opcache.enable_cli]        = 0
php_admin_value[opcache.memory_consumption] = 256
php_admin_value[opcache.interned_strings_buffer] = 32
php_admin_value[opcache.max_accelerated_files] = 100000
php_admin_value[opcache.revalidate_freq]   = 60
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.save_comments]      = 1
php_admin_value[opcache.fast_shutdown]      = 1

; -- Production PHP error behaviour (never show, always log) --
php_flag[display_errors]         = off
php_flag[display_startup_errors] = off
php_flag[html_errors]            = off
php_flag[log_errors]             = on
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT
php_admin_value[error_log]       = syslog
php_admin_value[syslog.ident]    = ulms-phpfpm
php_admin_flag[log_errors_max_len] = 0

; -- Session security (SAPI layer hardened; Moodle sets these again independently) --
php_flag[session.use_strict_mode]     = on
php_flag[session.use_only_cookies]    = on
php_flag[session.cookie_httponly]     = on
php_flag[session.cookie_secure]       = on
php_value[session.cookie_samesite]    = "Strict"
php_value[session.save_handler]       = files
;  -- Session storage lives OUTSIDE the webroot alongside moodledata:
php_value[session.save_path]          = %%REPLACE_WEBROOT%%-data/sessions
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor]   = 1000
php_admin_value[session.gc_maxlifetime] = 14400

; -- open_basedir (optional uncomment to enforce filesystem boundary for pool) --
;  php_admin_value[open_basedir] = "%%REPLACE_WEBROOT%%:/tmp/:/dev/urandom"

; -- Disable dangerous functions per-pool (belt-and-braces with disable_classes below) --
php_admin_value[disable_functions] = "exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,dl,link,symlink"

; -- Per-pool environment variables (INSTITUTION branding picked up by ulms_env() cascade) --
; If your institutional config lives in the repo-root .env you do NOT need to
; duplicate it here.  Env variables below are ONLY for values you want to
; constrain at the PHP-FPM pool level independently of .env:
;   env[INSTITUTION_NAME] = "Your University"
;   env[APP_ENV] = production
